<!doctype html>
<!--
  Dropping Jarwick into an existing page.

  This is the whole integration: a positioned container, one module import,
  and a handle you drive from your own code. No build step, no framework.

  Copy jarwick.standalone.js (packages/voice/dist/) next to your page and
  adjust the import path. Everything is inlined, including three.js.

  The orb alone needs no server. Speech and the conversation do — see
  INTEGRATION.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Jarwick — embed example</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0d1016;
      }

      /* The engine fills whatever box you give it. This one is the window;
         a panel in your own layout works just as well, as long as it has a
         size and its own stacking context. */
      #jarwick {
        position: fixed;
        inset: 0;
      }

      .demo-controls {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        font: 12px ui-monospace, Menlo, monospace;
      }

      .demo-controls button {
        padding: 6px 12px;
        border: 1px solid #262c3a;
        border-radius: 999px;
        background: #161a23;
        color: #eceef3;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="jarwick"></div>

    <div class="demo-controls">
      <button data-state="idle">Idle</button>
      <button data-state="listening">Listening</button>
      <button data-state="processing">Thinking</button>
      <button data-state="speaking">Speaking</button>
      <button data-state="error">Error</button>
    </div>

    <script type="module">
      import { createOrbScene } from '../packages/voice/dist/jarwick.standalone.js';

      const scene = createOrbScene(document.querySelector('#jarwick'), {
        initialState: 'idle',
      });

      // Drive it from wherever your app learns what Jarwick is doing.
      for (const button of document.querySelectorAll('[data-state]')) {
        button.addEventListener('click', () => scene.setState(button.dataset.state));
      }

      // Exposed so the page's own code — or a console — can drive it.
      window.jarwick = scene;

      window.addEventListener('beforeunload', () => scene.destroy());
    </script>
  </body>
</html>
